<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Confirming your Kita Browser account</title>
<style>
  :root {
    --bg: rgba(0, 0, 0, 0.95);
    --card-bg: rgba(255, 255, 255, 0.05);
    --card-border: rgba(255, 255, 255, 0.1);
    --text-primary: #ffffff;
    --text-secondary: #a0aec0;
    --accent: #ff6347;
    --accent-track: rgba(255, 99, 71, 0.24);
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .card {
    width: 100%;
    max-width: 360px;
    padding: 32px 28px;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    border-radius: 16px;
    text-align: center;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
  }

  p {
    margin: 0;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid var(--accent-track);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  .icon {
    width: 28px;
    height: 28px;
    margin: 0 auto 20px;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>
<div class="card">
  <div id="indicator" class="spinner"></div>
  <h1 id="heading">Confirming your account</h1>
  <p id="status">Hang tight&hellip;</p>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  var accessToken = params.get("access_token");
  var refreshToken = params.get("refresh_token");
  var indicatorEl = document.getElementById("indicator");
  var headingEl = document.getElementById("heading");
  var statusEl = document.getElementById("status");

  if (!accessToken || !refreshToken) {
    indicatorEl.remove();
    headingEl.textContent = "Confirmation link invalid";
    statusEl.textContent = "This link is invalid or has expired. Please try signing up again from the Kita Browser extension.";
    return;
  }

  window.postMessage(
    { source: "kita-browser-confirm", accessToken: accessToken, refreshToken: refreshToken },
    window.location.origin
  );

  indicatorEl.outerHTML =
    '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>';
  headingEl.textContent = "Account confirmed";
  statusEl.textContent = "You can close this tab and return to Kita Browser.";
})();
</script>
</body>
</html>
